<?xml version="1.0" encoding="UTF-8"?>
<!--
  Desktop launcher icon (task 31c): laptop + phone + two sync arrows, the
  same motif and path geometry as the Android app icon
  (android/app/src/main/res/drawable/ic_launcher_foreground.xml), on a
  solid version of the app's accent colour (#1565C0) so it stands alone as
  a normal desktop icon rather than needing a separate background layer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#1565C0" />

  <!-- Laptop: screen + keyboard base. -->
  <path fill="#FFFFFF" d="M8,32 L38,32 L38,58 L8,58 Z" />
  <path fill="#FFFFFF" d="M4,58 L42,58 L46,66 L0,66 Z" />

  <!-- Phone: body + home indicator. -->
  <path fill="#FFFFFF" d="M70,24 L98,24 L98,84 L70,84 Z" />
  <path fill="#1565C0" d="M80,78 L88,78 L88,81 L80,81 Z" />

  <!-- Sync arrows: laptop -> phone (top), phone -> laptop (bottom). -->
  <path fill="#FFFFFF" d="M44,38 L44,30 L62,44 L44,58 L44,50 L52,50 L52,38 Z" />
  <path fill="#FFFFFF" d="M64,70 L64,78 L46,64 L64,50 L64,58 L56,58 L56,70 Z" />
</svg>
