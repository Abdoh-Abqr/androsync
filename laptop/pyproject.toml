[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androsync"
version = "0.2.0"
description = "USB/Wi-Fi folder sync between an Ubuntu laptop and an Android phone"
authors = [{ name = "Abdoh-Abqr" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
qr = [
    "qrcode",
]

[project.scripts]
androsync = "androsync.cli:main"

[tool.setuptools.packages.find]
include = ["androsync*"]

[tool.setuptools.package-data]
androsync = ["assets/*.svg"]
